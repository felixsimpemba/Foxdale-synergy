name: Deploy

# Ships the backend to the server over SSH on every push to main (or a manual run).
# Tests are not run in this workflow; run them locally with `php artisan test`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never run two production deploys at the same time.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only from main, only after a real push (or a manual run), and only once the
    # DEPLOY_ENABLED repository variable is "true".
    if: >-
      vars.DEPLOY_ENABLED == 'true'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          missing=""
          [ -n "${SSH_HOST:-}" ] || missing="$missing SSH_HOST"
          [ -n "${SSH_USER:-}" ] || missing="$missing SSH_USER"
          [ -n "${SSH_PRIVATE_KEY:-}" ] || missing="$missing SSH_PRIVATE_KEY"
          [ -n "${DEPLOY_PATH:-}" ] || missing="$missing DEPLOY_PATH"

          if [ -n "$missing" ]; then
            echo "::error title=Deployment secrets missing::Add these repository secrets under Settings > Secrets and variables > Actions > Secrets:$missing"
            exit 1
          fi

          mkdir -p ~/.ssh

          # Secrets are often pasted with surrounding quotes, CRLF line endings or
          # literal "\n" sequences. Normalise all three before checking the key.
          key="$SSH_PRIVATE_KEY"
          key="${key#\"}"; key="${key%\"}"
          key="${key#\'}"; key="${key%\'}"
          key="${key//\\n/$'\n'}"
          printf '%s\n' "$key" > ~/.ssh/id_deploy
          sed -i -e 's/\r$//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' ~/.ssh/id_deploy
          sed -i '/./,$!d' ~/.ssh/id_deploy

          # Some people store the key base64-encoded. Decode it if the text is not
          # already a private key.
          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/id_deploy; then
            if base64 -d ~/.ssh/id_deploy > ~/.ssh/id_decoded 2>/dev/null \
              && grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/id_decoded; then
              mv ~/.ssh/id_decoded ~/.ssh/id_deploy
            fi
          fi

          chmod 600 ~/.ssh/id_deploy

          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' ~/.ssh/id_deploy; then
            echo "::error title=SSH_PRIVATE_KEY is not a private key file::The secret must be the private key (no .pub), starting with -----BEGIN OPENSSH PRIVATE KEY-----."
            exit 1
          fi

          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error title=SSH_PRIVATE_KEY could not be read::The key is incomplete or has a passphrase. Create one without a passphrase: ssh-keygen -t ed25519 -f ~/.ssh/foxdale_deploy -N \"\""
            exit 1
          fi

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "::notice::Using the pinned SSH_KNOWN_HOSTS secret."
          elif ! ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2> /tmp/keyscan.log; then
            echo "::error title=Cannot read the server host key::ssh-keyscan could not reach ${SSH_HOST}:${SSH_PORT} from the runner. Check SSH_HOST (just the address, no ssh://) and that the VPS firewall allows SSH from GitHub. Or pin the key with an SSH_KNOWN_HOSTS secret."
            head -5 /tmp/keyscan.log || true
            exit 1
          else
            echo "::notice::Fetched the host key for ${SSH_HOST}:${SSH_PORT}."
          fi

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);' || {
            echo "PHP 8.3 or newer is required on the server." >&2
            exit 1
          }

          git fetch --prune origin main
          echo "Deploying $(git log -1 --format='%h %s' origin/main)"

          # The server keeps its own .env, storage and vendor: they are git-ignored.
          git reset --hard origin/main

          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force
          php artisan optimize
          php artisan queue:restart

          echo "Deployed."
          REMOTE

      - name: Health check
        if: vars.HEALTHCHECK_URL != ''
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$HEALTHCHECK_URL" > /dev/null; then
              echo "Healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed: $HEALTHCHECK_URL" >&2
          exit 1

# Repository settings this workflow expects
# -----------------------------------------
# Secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST          server address
#   SSH_USER          deploy user (needs write access to DEPLOY_PATH, and php/composer on PATH)
#   SSH_PRIVATE_KEY   private key for that user (no passphrase)
#   SSH_PORT          optional, defaults to 22
#   SSH_KNOWN_HOSTS   optional, pinned host key(s); otherwise ssh-keyscan is used
#   DEPLOY_PATH       absolute path of the checkout on the server, e.g. /var/www/foxdale
#
# Variables:
#   DEPLOY_ENABLED    "true" to turn deployments on
#   HEALTHCHECK_URL   optional, e.g. https://api.example.com/up
#
# The server checkout must already exist (git clone + .env + storage permissions) and its
# origin must be this repository. Keep a queue worker running; the deploy restarts it.
